<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>モシモ・マス｜次期学習指導要領対応・中高一貫6年数学ラボ</title>
<meta name="description" content="モシモ・マスは、次期学習指導要領対応の5つの道・全18単元を、スライダー実験で学べる中高一貫6年数学ラボです。教科書や授業のわかり直しに。">
<meta property="og:title" content="モシモ・マス｜次期学習指導要領対応・中高一貫6年数学ラボ">
<meta property="og:description" content="5つの道・全18単元をスライダーで動かして実験できる、中高一貫6年の数学ラボ。習った順に道をたどるわかり直しと、つまずき逆引きつき。">
<meta property="og:type" content="website">
<meta property="og:image" content="og-image.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#1e293b; --ink-soft:#475569; --ink-faint:#94a3b8;
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
  --accent:#4f46e5; --accent-soft:#eef2ff;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-text-size-adjust:100%;
}
.math-var{font-family:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif; font-style:italic;}
button{font:inherit; cursor:pointer;}
h1,h2,h3{margin:0;}
/* ---------- field colors ---------- */
[data-field="num"]{--field-c:#4f46e5; --field-bg:#eef2ff;}
[data-field="geo"]{--field-c:#059669; --field-bg:#ecfdf5;}
[data-field="chg"]{--field-c:#d97706; --field-bg:#fffbeb;}
[data-field="dat"]{--field-c:#e11d48; --field-bg:#fff1f2;}
[data-field="log"]{--field-c:#7c3aed; --field-bg:#f5f3ff;}
[data-field="soc"]{--field-c:#0891b2; --field-bg:#ecfeff;}
/* ---------- header ---------- */
.app-header{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.97); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 12px;
}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0;}
.brand h1{font-size:20px; font-weight:800; letter-spacing:.02em; white-space:nowrap;}
.brand .version{font-size:11px; color:var(--ink-faint); font-weight:700;}
.explored-badge{
  font-size:11px; font-weight:700; color:#92400e;
  background:#fffbeb; border:1px solid #fde68a; border-radius:999px; padding:3px 9px; white-space:nowrap;
}
.header-controls{display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;}
.seg{display:flex; background:#e2e8f0; border-radius:9px; padding:2px; gap:2px;}
.seg button{
  border:0; background:transparent; color:var(--ink-soft);
  font-size:11px; font-weight:700; padding:5px 9px; border-radius:7px; white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(15,23,42,.18);}
.hbtn{
  border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  font-size:11px; font-weight:700; padding:6px 10px; border-radius:9px; white-space:nowrap;
}
.hbtn:hover{color:var(--accent); border-color:var(--accent);}
/* ---------- layout base ---------- */
.layout{
  display:grid; gap:14px; padding:14px;
  width:100%; max-width:1600px; margin:0 auto;
  align-items:start;
}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
/* pill bar */
.pillbar{
  display:none; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
}
.pill-group{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
.pill-group:last-child{margin-bottom:0;}
.pill-group .pg-name{font-size:11px; font-weight:800; color:var(--field-c,var(--ink-soft)); white-space:nowrap; margin-right:2px;}
.pill{
  border:1.5px solid var(--field-c,#cbd5e1); color:var(--ink); background:#fff;
  font-size:12px; font-weight:700; padding:6px 11px; border-radius:999px; white-space:nowrap; flex:0 0 auto;
}
.pill[aria-pressed="true"]{background:var(--field-c); color:#fff;}
.pill .done{font-size:10px;}
/* tree nav */
.tree{display:none;}
.tree .field-block{margin-bottom:14px;}
.tree .field-block:last-child{margin-bottom:0;}
.tree .field-name{font-size:12px; font-weight:800; color:var(--field-c); margin-bottom:2px;}
.tree .field-desc{font-size:11px; color:var(--ink-faint); margin-bottom:6px; line-height:1.5;}
.tree .topic-btn{
  display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff;
  border-left:4px solid var(--field-c,#cbd5e1); border-radius:9px;
  padding:8px 10px; margin-bottom:6px; font-size:13px; font-weight:700; color:var(--ink); line-height:1.4;
}
.tree .topic-btn small{display:block; font-size:11px; font-weight:500; color:var(--ink-faint); margin-top:1px;}
.tree .topic-btn[aria-pressed="true"]{background:var(--field-bg); border-color:var(--field-c);}
.tree .topic-btn .done{color:var(--field-c); font-size:11px;}
/* lab */
.lab{display:flex; flex-direction:column; gap:14px; min-width:0;}
.topic-head .field-badge{
  display:inline-block; font-size:11px; font-weight:800; color:var(--field-c);
  background:var(--field-bg); border-radius:999px; padding:3px 10px; margin-bottom:6px;
}
.topic-head h2{font-size:19px; font-weight:800; line-height:1.35;}
.topic-head .unit{font-size:12px; color:var(--ink-soft); margin-top:3px; font-weight:600;}
.topic-head .hook{
  margin-top:9px; font-size:13.5px; line-height:1.65; color:var(--ink);
  background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:9px 11px;
}
.topic-head .guide-line{
  margin:9px 0 0; font-size:14px; font-weight:700; line-height:1.6; color:var(--ink);
  background:var(--field-bg); border-left:5px solid var(--field-c); border-radius:8px; padding:9px 11px;
}
.topic-head .guide-line .gl-label{color:var(--field-c); font-weight:800;}
/* prev / next topic nav */
.topic-nav{display:flex; gap:10px;}
.topic-nav .tn-btn{
  flex:1 1 0; min-width:0; min-height:56px;
  border:1.5px solid var(--accent); background:#fff; color:var(--ink);
  border-radius:12px; padding:8px 12px; text-align:left;
  display:flex; flex-direction:column; gap:1px; justify-content:center;
}
.topic-nav .tn-btn.tn-next{text-align:right; align-items:flex-end;}
.topic-nav .tn-label{font-size:14px; font-weight:800; color:var(--accent); white-space:nowrap;}
.topic-nav .tn-title{font-size:12px; font-weight:600; color:var(--ink-soft); overflow-wrap:anywhere; line-height:1.35;}
.topic-nav .tn-btn:disabled{opacity:.4; border-color:var(--line); cursor:default;}
.topic-nav .tn-btn:disabled .tn-label{color:var(--ink-faint);}
.topic-nav-top .tn-btn{min-height:46px; padding:6px 12px;}
.scroll-hint{display:none; margin:0; font-size:12.5px; font-weight:700; color:var(--accent); text-align:center;}
/* narration (v1.0.2) */
.narration-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.narrate-btn{
  border:1.5px solid var(--accent); background:var(--accent); color:#fff;
  font-size:14px; font-weight:800; padding:10px 16px; border-radius:11px; min-height:48px;
}
.narrate-stop-btn{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  font-size:14px; font-weight:800; padding:10px 16px; border-radius:11px; min-height:48px;
}
.narrate-stop-btn:disabled{opacity:.4; cursor:default;}
.narrate-status{font-size:12px; color:var(--ink-faint); font-weight:600;}
/* stage labels (v1.0.2) */
.stage-badge{
  display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--accent);
  border-radius:999px; padding:3px 10px; margin-bottom:6px; margin-left:6px;
}
.stage-chip{
  display:inline-block; font-size:10.5px; font-weight:800; color:var(--accent);
  background:var(--accent-soft); border-radius:6px; padding:1px 6px; margin-right:6px;
}
.tree .stage-block{margin-bottom:14px;}
.tree .stage-name{font-size:12.5px; font-weight:800; color:var(--accent); margin-bottom:6px;}
.pill-group .pg-name.stage{color:var(--accent);}
/* paths (v2.0.0・第2期 2A) */
[data-path="path_num"]{--field-c:#4f46e5; --field-bg:#eef2ff;}
[data-path="path_geo"]{--field-c:#059669; --field-bg:#ecfdf5;}
[data-path="path_chg"]{--field-c:#d97706; --field-bg:#fffbeb;}
[data-path="path_dat"]{--field-c:#e11d48; --field-bg:#fff1f2;}
[data-path="path_log"]{--field-c:#7c3aed; --field-bg:#f5f3ff;}
/* grade filter (v2.0.0) */
.grade-filter{
  flex:1 1 100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  border-top:1px dashed var(--line); padding-top:7px;
}
.gf-label{font-size:11.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap;}
#gradeFilterSeg{flex-wrap:wrap;}
.gf-notice{font-size:11.5px; font-weight:700; color:var(--accent);}
.gf-notice:empty{display:none;}
/* path view (v2.0.0) */
.tree-intro{font-size:13.5px; font-weight:800; line-height:1.6; color:var(--ink); margin-bottom:12px;}
.tree-intro small{display:block; font-size:11.5px; font-weight:600; color:var(--ink-faint); margin-top:2px; line-height:1.55;}
.tree .path-block{margin-bottom:16px;}
.tree .path-block:last-child{margin-bottom:0;}
.tree .path-name{font-size:13.5px; font-weight:800; color:var(--field-c);}
.tree .path-count{font-size:11px; font-weight:700; color:var(--ink-faint); margin-left:6px;}
.tree .path-desc{font-size:11px; color:var(--ink-faint); margin:2px 0 7px; line-height:1.5;}
.tree .path-empty{font-size:12px; color:var(--ink-faint); line-height:1.6; margin:0 0 4px;}
.tag-badge{
  display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#64748b;
  border-radius:6px; padding:1px 6px; margin-right:6px; vertical-align:1px;
}
.tag-badge-head{
  display:inline-block; font-size:11px; font-weight:800; color:#fff; background:#64748b;
  border-radius:999px; padding:3px 10px; margin-bottom:6px; margin-left:6px;
}
.path-crumb{font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:7px;}
.guide-crumb{font-size:12px; font-weight:700; color:var(--accent); margin:0 0 8px;}
.guide-crumb:empty{display:none;}
/* pillbar path switch (v2.0.0) */
.pill-paths{display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; padding-bottom:2px; margin-bottom:8px;}
.pill-path-btn{
  border:1.5px solid var(--field-c,#cbd5e1); color:var(--ink); background:#fff;
  font-size:12.5px; font-weight:800; padding:7px 12px; border-radius:999px; white-space:nowrap; flex:0 0 auto;
}
.pill-path-btn[aria-pressed="true"]{background:var(--field-c); color:#fff;}
.pill-path-btn .pp-count{font-size:10.5px; font-weight:700; opacity:.85; margin-left:4px;}
.pill-empty{font-size:12px; color:var(--ink-faint); font-weight:600; align-self:center; white-space:nowrap;}
/* cross-path nav (v2.0.0) */
.topic-nav .tn-btn.tn-cross{border-style:dashed; opacity:.78;}
.topic-nav .tn-btn.tn-cross .tn-label{color:var(--ink-soft);}
.canvas-wrap{position:relative; width:100%; height:320px;}
#simCanvas{display:block; width:100%; height:100%;}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.kpi{background:#f8fafc; border:1px solid var(--line); border-radius:11px; padding:10px 11px; min-width:0;}
.kpi .k-label{font-size:11px; font-weight:700; color:var(--ink-soft); line-height:1.4; overflow-wrap:anywhere;}
.kpi .k-val{font-size:19px; font-weight:800; color:var(--accent); margin-top:2px; overflow-wrap:anywhere;}
.kpi .k-sub{font-size:11px; color:var(--ink-faint); margin-top:1px; line-height:1.45; overflow-wrap:anywhere;}
.sliders-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
.sliders-head h3{font-size:13px; font-weight:800;}
.link-btn{border:0; background:none; color:var(--accent); font-size:11.5px; font-weight:700; padding:2px;}
.slider-row{margin-bottom:13px;}
.slider-row:last-child{margin-bottom:2px;}
.slider-row .sr-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px;}
.slider-row .sr-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); overflow-wrap:anywhere;}
.slider-row .sr-val{font-size:13.5px; font-weight:800; color:var(--accent); white-space:nowrap;}
input[type="range"]{
  -webkit-appearance:none; appearance:none; width:100%; height:34px; background:transparent; display:block; margin:0;
}
input[type="range"]::-webkit-slider-runnable-track{height:8px; border-radius:99px; background:#e0e7ff;}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
  background:var(--accent); border:3px solid #fff; box-shadow:0 1px 5px rgba(15,23,42,.35); margin-top:-10px;
}
input[type="range"]::-moz-range-track{height:8px; border-radius:99px; background:#e0e7ff;}
input[type="range"]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 1px 5px rgba(15,23,42,.35);}
/* side */
.side{display:flex; flex-direction:column; gap:14px; min-width:0;}
.side .block h3{font-size:13px; font-weight:800; margin-bottom:8px;}
.grade-seg{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; background:#f1f5f9; border-radius:10px; padding:4px; margin-bottom:9px;}
.grade-seg button{
  border:0; background:transparent; color:var(--ink-soft); font-size:11.5px; font-weight:700;
  padding:7px 4px; border-radius:7px; line-height:1.3;
}
.grade-seg button[aria-pressed="true"]{background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(15,23,42,.15);}
.level-text{font-size:13px; line-height:1.75; color:var(--ink); overflow-wrap:anywhere;}
.guide-text{font-size:13px; line-height:1.75; color:var(--ink); overflow-wrap:anywhere;}
.guide-formula{
  margin-top:9px; font-size:13px; color:var(--ink-soft); line-height:1.7;
  background:#f8fafc; border:1px dashed var(--line); border-radius:9px; padding:8px 10px;
}
.rewind-btn{
  display:block; width:100%; text-align:left; margin-bottom:7px;
  border:1.5px solid var(--field-c,#cbd5e1); background:#fff; color:var(--ink);
  border-radius:10px; padding:9px 11px; font-size:13px; font-weight:700; line-height:1.45;
}
.rewind-btn small{display:block; font-size:11px; font-weight:500; color:var(--ink-faint); margin-top:1px;}
.rewind-btn:hover{background:var(--field-bg);}
.rewind-none{font-size:12.5px; color:var(--ink-faint); line-height:1.6;}
#sketchCanvas{
  display:block; width:100%; height:150px; background:#fffdf5;
  border:1px solid #fde68a; border-radius:10px; touch-action:none; cursor:crosshair;
}
.memo-tools{display:flex; justify-content:flex-end; margin:6px 0;}
#memoText{
  width:100%; min-height:76px; resize:vertical; font:inherit; font-size:13px; line-height:1.6;
  border:1px solid var(--line); border-radius:10px; padding:9px 10px; color:var(--ink); background:#fff;
}
#memoText:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent;}
/* bottom tabs (mobile) */
.bottomtabs{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(255,255,255,.98); border-top:1px solid var(--line);
  grid-template-columns:repeat(4,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomtabs button{
  border:0; background:none; padding:9px 2px 10px; min-height:52px;
  font-size:11px; font-weight:700; color:var(--ink-faint); line-height:1.3;
}
.bottomtabs button[aria-pressed="true"]{color:var(--accent); box-shadow:inset 0 2px 0 var(--accent);}
.footer-note{font-size:11px; color:var(--ink-faint); text-align:center; padding:4px 14px 18px; line-height:1.6;}
.pillbar,.tree,.lab,.side{min-width:0;}
.pill-group{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin; padding-bottom:2px;}
.tree{grid-area:tree;} .lab{grid-area:lab;} .side{grid-area:side;} .pillbar{grid-area:pill;}
</style>
<style>
/* ============================================================
   3モードレイアウト
   - 手動指定時：body[data-device="mobile|tablet|pc"] の属性ルールで切替（こちらが優先）
   - 自動時：body[data-device="auto"] のときだけメディアクエリが効く
   ============================================================ */
/* ---------- PC ---------- */
body[data-device="pc"] .layout{
  grid-template-columns:280px minmax(0,1fr) 330px;
  grid-template-areas:"tree lab side";
}
body[data-device="pc"] .tree{display:block;}
body[data-device="pc"] .pillbar{display:none;}
body[data-device="pc"] .bottomtabs{display:none;}
@media (min-width:1120px){
  body[data-device="auto"] .layout{
    grid-template-columns:280px minmax(0,1fr) 330px;
    grid-template-areas:"tree lab side";
  }
  body[data-device="auto"] .tree{display:block;}
  body[data-device="auto"] .pillbar{display:none;}
  body[data-device="auto"] .bottomtabs{display:none;}
}
/* ---------- Tablet ---------- */
body[data-device="tablet"] .layout{
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  grid-template-areas:"pill pill" "lab side";
}
body[data-device="tablet"] .pillbar{display:block;}
body[data-device="tablet"] .tree{display:none;}
body[data-device="tablet"] .bottomtabs{display:none;}
@media (min-width:768px) and (max-width:1119.98px){
  body[data-device="auto"] .layout{
    grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    grid-template-areas:"pill pill" "lab side";
  }
  body[data-device="auto"] .pillbar{display:block;}
  body[data-device="auto"] .tree{display:none;}
  body[data-device="auto"] .bottomtabs{display:none;}
}
/* ---------- Mobile ---------- */
body[data-device="mobile"] .layout{
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"lab" "side" "tree";
  padding:10px 10px 14px;
}
body[data-device="mobile"] .pillbar{display:none;}
body[data-device="mobile"] .bottomtabs{display:grid;}
body[data-device="mobile"] .footer-note{padding-bottom:84px;}
/* v1.0.2: 実験の並びを Canvas → スライダー → KPI にし、Canvas を上部に固定する */
body[data-device="mobile"] .topic-nav-top{order:1;}
body[data-device="mobile"] .topic-head{order:2;}
body[data-device="mobile"] .narration-bar{order:3;}
body[data-device="mobile"] .canvas-card{
  order:4; position:sticky; top:calc(var(--header-h,60px) + 6px); z-index:30;
  box-shadow:0 8px 20px rgba(15,23,42,.14);
}
body[data-device="mobile"] .scroll-hint{order:5;}
body[data-device="mobile"] .sliders-card{order:6;}
body[data-device="mobile"] .kpis{order:7;}
body[data-device="mobile"] .topic-nav-bottom{order:8;}
body[data-device="mobile"] .canvas-wrap{height:210px;}
body[data-device="mobile"] .scroll-hint{display:block;}
body[data-device="mobile"] .brand h1{font-size:18px;}
body[data-device="mobile"][data-tab="lab"] .tree,
body[data-device="mobile"][data-tab="lab"] .side{display:none;}
body[data-device="mobile"][data-tab="rewind"] .lab,
body[data-device="mobile"][data-tab="rewind"] .tree{display:none;}
body[data-device="mobile"][data-tab="rewind"] .side .block-guide,
body[data-device="mobile"][data-tab="rewind"] .side .block-memo{display:none;}
body[data-device="mobile"][data-tab="catalog"] .lab,
body[data-device="mobile"][data-tab="catalog"] .side{display:none;}
body[data-device="mobile"][data-tab="catalog"] .tree{display:block;}
body[data-device="mobile"][data-tab="memo"] .lab,
body[data-device="mobile"][data-tab="memo"] .tree{display:none;}
body[data-device="mobile"][data-tab="memo"] .side .block-grade,
body[data-device="mobile"][data-tab="memo"] .side .block-guide,
body[data-device="mobile"][data-tab="memo"] .side .block-rewind{display:none;}
@media (max-width:767.98px){
  body[data-device="auto"] .layout{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"lab" "side" "tree";
    padding:10px 10px 14px;
  }
  body[data-device="auto"] .pillbar{display:none;}
  body[data-device="auto"] .bottomtabs{display:grid;}
  body[data-device="auto"] .footer-note{padding-bottom:84px;}

          { label: '対角線(1辺×√2)', val: (side * Math.SQRT2).toFixed(2), sub: 'A4用紙の比率と同じ' }

          { label: 'バラした形（展開）', val: `x² + ${sum}x + ${prod}`, sub: '4つのパーツの合計' },
          { label: '面積が0になるx', val: `x = -${v.a}, -${v.b}`, sub: '二次方程式の解' }
        ],
        sum, prod
      };
    },
    draw(ctx, w, h, v) {
      ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = bg; ctx.fillRect(x, y, bw, bh);

      drawBox(ox + xLen, oy + xLen, bLen, aLen, '#ffe4e6', '#f43f5e', `${v.a * v.b}`);

      ctx.fillStyle = '#475569'; ctx.font = 'bold 12px Inter, sans-serif';
      ctx.fillText(`x + ${v.b}`, ox + (xLen + bLen) / 2 - 15, oy - 10);
      ctx.fillText(`x + ${v.a}`, ox - 42, oy + (xLen + aLen) / 2);

        ],
        rx, ry, wr
      };

        ctx.moveTo(x2, y2);

        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.fillText(label, (x1 + x2) / 2 + 6, (y1 + y2) / 2 - 6);

      const dx = ox + v.droneSpd * scale, dy = oy;

      arrow(ox, oy, dx, dy, '#4f46e5', `ドローン(${v.droneSpd})`);
      // Wind vector from tip
      if (v.windSpd > 0) {

      arrow(ox, oy, dx + wx, dy + wy, '#f43f5e', '実際の進路');

    ],
    compute(v) {
      const k = Math.min(v.heads, v.n);
      // Normal approx z-score for p=0.5
      const mean = v.n * 0.5;

      const z = Math.abs(k - mean) / sd;
      const isWeird = z >= 1.96; // 5% significance level
      return {

          { label: 'ズレの大きさ (z値)', val: `${z.toFixed(2)} σ`, sub: '1.96超で珍しい(5%以下)' },
          { label: '検定の判定', val: isWeird ? '怪しい！(棄却)' : '偶然の範囲内', sub: isWeird ? '有意水準5%で異常' : 'イカサマとは言えない' }

    },
    draw(ctx, w, h, v, res) {
      ctx.clearRect(0, 0, w, h);
      const pad = 42, gw = w - pad * 2, gh = h - pad * 2;

      // Normal curve
      const maxPdf = 1 / (res.sd * Math.sqrt(2 * Math.PI));
      const toY = pdf => h - pad - (pdf / maxPdf) * gh * 0.85;

      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();

      const low = Math.max(0, res.mean - 1.96 * res.sd), high = Math.min(v.n, res.mean + 1.96 * res.sd);

        const pdf = Math.exp(-0.5 * Math.pow((x - res.mean) / res.sd, 2)) / (res.sd * Math.sqrt(2 * Math.PI));

      { key: 'step', label: 'どこまで実験で見る？', min: 1, max: 10, step: 1, def: 6 }
    ],
    compute(v) {
      const chainOk = v.gap <= 2;
      const allFall = v.first === 1 && chainOk;
      return {
        kpis: [
          { label: '① スタート条件 (n=1)', val: v.first ? 'OK (倒れる)' : 'NG (倒れない)', sub: '最初の1個が倒れるか' },
          { label: '② 連鎖条件 (k→k+1)', val: chainOk ? 'OK (次も倒れる)' : 'NG (届かない！)', sub: '間隔が広すぎると止まる' },
          { label: '無限に倒れる証明', val: allFall ? '証明完了！' : '証明失敗', sub: allFall ? '①と②の両方が成立' : 'どちらかが欠けている' }

  {
    id: 'log_algo',
    stage: '数A',
    stageOrder: 5,
    field: 'log',
    path: 'path_log',
    pathOrder: 4,
    gradeRank: 4,
    title: '迷路の最短ルート＆アルゴリズム論理',
    unit: '離散数学・論理的思考・情報科連携',
    dailyHook: 'カーナビやゲームの敵キャラはどうやって「最短ルート」を迷わず見つけているの？',
    guide: 'ブロック数と通行止めを動かして、最短ルートの数を数えよう',
    guidance: '新学習指導要領で重視される「数学と情報科の連携」。条件分岐とステップ数の見積もりがアルゴリズムの心臓部です。',
    rewindIds: ['log_cond', 'log_induct'],
    params: [
      { key: 'grid', label: '街のブロック数 (N×N)', min: 2, max: 6, step: 1, def: 4 },
      { key: 'block', label: '通行止めの位置 (0:なし〜2)', min: 0, max: 2, step: 1, def: 1 }
    ],
    compute(v) {
      // Combinations (2N choose N)
      const fact = n => (n <= 1 ? 1 : n * fact(n - 1));
      const totalWays = fact(2 * v.grid) / (fact(v.grid) * fact(v.grid));
      const m = Math.floor(v.grid / 2);
      const comb = (n, k) => fact(n) / (fact(k) * fact(n - k));
      const blockedWays = v.block === 0 ? 0 : comb(2 * m, m) * comb(2 * (v.grid - m), v.grid - m);
      const validWays = Math.max(1, totalWays - blockedWays);
      return {
        kpis: [
          { label: '最短距離の歩数', val: `${v.grid * 2} ブロック`, sub: 'どの最短ルートでも同じ' },
          { label: '最短ルートの総数', val: `${validWays} 通り`, sub: `障害物なしなら ${totalWays}通り` },
          { label: '計算ステップの工夫', val: '動的計画法', sub: '左上から足し算で求める' }
        ],
        totalWays, validWays
      };
    },
    draw(ctx, w, h, v) {
      ctx.clearRect(0, 0, w, h);
      const n = v.grid, size = Math.min(w - 90, h - 70), cell = size / n;
      const ox = (w - size) / 2, oy = (h - size) / 2;
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
      for (let i = 0; i <= n; i++) {
        ctx.beginPath(); ctx.moveTo(ox, oy + i * cell); ctx.lineTo(ox + size, oy + i * cell); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox + i * cell, oy); ctx.lineTo(ox + i * cell, oy + size); ctx.stroke();
      }
      // Start & Goal
      ctx.fillStyle = '#4f46e5'; ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(ox + size, oy + size, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText('S', ox - 14, oy + 4); ctx.fillText('G', ox + size + 10, oy + size + 4);

      // Blocked intersection
      if (v.block > 0) {
        const bx = ox + Math.floor(n / 2) * cell, by = oy + Math.floor(n / 2) * cell;
        ctx.fillStyle = '#e11d48';
        ctx.fillText('✖通行止', bx - 20, by + 4);
      }
      // Sample shortest path
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + size, oy); ctx.lineTo(ox + size, oy + size); ctx.stroke();
    },
    levels: {
      elem_j1: '右と下にしか進めないとき、どの道を通っても合計の歩数は同じになります。交差点ごとに道順を足してみよう！',
      j2_j3: '「AかつB」「Aではない」などの論理条件を整理すると、通行止めを避ける正しい道順が漏れなく数えられます。',
      h1: '同じものを含む順列 (2N)! / (N! N!) を使うと、一発で最短経路の総数が計算できます。',
      h2_h3: '情報科の「アルゴリズム（幅優先探索・動的計画法）」と数学の「場合の数・グラフ理論」が融合する領域です。'
    }
  },

  {
    id: 'soc_matrix',
    stage: '発展',
    stageOrder: 8,
    field: 'soc',
    path: 'path_geo',
    pathOrder: 13,
    gradeRank: 6,
    title: '行列で画像を回転＆拡大（AI・CG）',
    unit: '行列（新指導要領 統合科目）・線形変換',
    dailyHook: 'スマホの写真アプリで画像を「回転・傾け・拡大」するとき、裏ではたった4つの数字（行列）が動いてる！',
    guide: '拡大・回転・傾きを動かして、画像がどう変わるか確かめよう',
    guidance: '次期指導要領で高校数学の重要トピックに復帰する「行列」。3Dゲーム、AIのニューラルネットワーク、画像処理の基本です。',
    rewindIds: ['geo_vector'],
    params: [
      { key: 'scale', label: '拡大率 (%)', min: 50, max: 180, step: 10, def: 120 },
      { key: 'angle', label: '回転角度 (度)', min: -90, max: 90, step: 15, def: 30 },
      { key: 'shear', label: '斜め傾き (シアー)', min: -5, max: 5, step: 1, def: 0 }
    ],
    compute(v) {
      const s = v.scale / 100;
      const rad = (v.angle * Math.PI) / 180;
      const sh = v.shear * 0.15;
      const a = s * Math.cos(rad);
      const b = -s * Math.sin(rad) + sh;
      const c = s * Math.sin(rad);
      const d = s * Math.cos(rad);
      const det = a * d - b * c;
      return {
        kpis: [
          { label: '変換行列 [a b / c d]', val: `[${a.toFixed(2)}, ${b.toFixed(2)}]`, sub: `[${c.toFixed(2)}, ${d.toFixed(2)}]` },
          { label: '面積の倍率 (行列式)', val: `${Math.abs(det).toFixed(2)}倍`, sub: 'ad - bc の値' },
          { label: '逆変換できる？', val: Math.abs(det) > 0.01 ? '元に戻せる' : '潰れて戻せない', sub: '逆行列の有無' }
        ],
        a, b, c, d
      };
    },
    draw(ctx, w, h, v, res) {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, unit = Math.min(w, h) * 0.18;
      // Axes
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(20, cy); ctx.lineTo(w - 20, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 20); ctx.lineTo(cx, h - 20); ctx.stroke();

      const pts = [[0, 0], [1, 0], [1, 1], [0, 1]];
      // Original ghost square
      ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([4, 4]);
      ctx.strokeRect(cx, cy - unit, unit, unit);
      ctx.setLineDash([]);

      // Transformed polygon
      ctx.fillStyle = 'rgba(6, 182, 212, 0.25)';
      ctx.strokeStyle = '#0891b2'; ctx.lineWidth = 3;
      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const nx = cx + (res.a * x + res.b * y) * unit;
        const ny = cy - (res.c * x + res.d * y) * unit;
        if (i === 0) ctx.moveTo(nx, ny); else ctx.lineTo(nx, ny);
      });
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Inter, sans-serif';
      ctx.fillText('点線：元の画像 → 青：行列変換後', 20, 26);
    },
    levels: {
      elem_j1: '4つの数字の表を使うと、図形をぐるっと回したり、大きくしたり、斜めに引き伸ばしたりできます。',
      j2_j3: '連立方程式の係数だけを抜き出したものが「行列」の正体です。',
      h1: '高校で学ぶ「行列」。座標 (x, y) に行列を掛けるだけで、画面上のすべてのピクセルを一斉に動かせます。',
      h2_h3: '行列式 ad-bc は「面積が何倍になるか」を表し、AIの大量データ計算（テンソル演算）の基礎そのものです。'
    }
  },
  {

    gradeRank: 6,
    title: '流行・SNS噂のピークアウト予測',

    ],
    compute(v) {
      const effR = v.r0 * (1 - v.vacc / 100);
      const herdThreshold = Math.max(0, (1 - 1 / v.r0) * 100);
      const peakPct = effR <= 1 ? 0 : Math.min(60, (effR - 1) * 15);
      return {
        kpis: [
          { label: '実効再生産数', val: effR.toFixed(2), sub: effR > 1 ? '拡大中 (>1)' : '収束へ (≦1)' },
          { label: '流行を止める対策率', val: `${herdThreshold.toFixed(0)}%`, sub: '集団免疫のしきい値' },
          { label: '同時流行のピーク', val: effR <= 1 ? '流行しない' : `人口の約${peakPct.toFixed(0)}%`, sub: '対策で山を低くできる' }
        ],
        effR
      };
    },
    draw(ctx, w, h, v, res) {
      ctx.clearRect(0, 0, w, h);
      const pad = 42, gw = w - pad * 2, gh = h - pad * 2;
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();

      // Simulate simple SIR
      let S = 1 - v.vacc / 100 - 0.01, I = 0.01, R = v.vacc / 100;

        const dI = beta * S * I - gamma * I;

        if (saved.params && typeof saved.params === "object") state.params = saved.params;
        if (typeof saved.memoText === "string") state.memoText = saved.memoText;
        if (typeof saved.muted === "boolean") state.muted = saved.muted;
        if (Array.isArray(saved.exploredIds)) state.exploredIds = saved.exploredIds.filter(function(x){ return typeof x === "string"; });
      }
    }
  } catch (e) { /* 保存データが読めない場合は初期値で続行 */ }

  var topics = (typeof TOPICS !== "undefined" && Array.isArray(TOPICS)) ? TOPICS : [];
  var fields = (typeof FIELDS !== "undefined" && Array.isArray(FIELDS)) ? FIELDS : [];
  var gradeLevels = (typeof GRADE_LEVELS !== "undefined" && Array.isArray(GRADE_LEVELS)) ? GRADE_LEVELS : [
    { id: "elem_j1", label: "小接続〜中1" },
    { id: "j2_j3", label: "中2〜中3" },
    { id: "h1", label: "高1" },
    { id: "h2_h3", label: "高2〜高3" }
  ];

  /* ===== 道ビューと学年フィルタ（v2.0.0・第2期 2A／PHASE2_DESIGN §2・§6・§7） =====
     カタログは「道ビュー」：5つの道ごとにグループ化し、道の中では学習順
     （pathOrder 昇順）に並べる。学年フィルタは累積式で、gradeRank <= gradeLimit
     の場面だけを表示する。v1.0.2 の stage／stageOrder は土台として残し、
     stage は中心学年バッジとして表示を続ける。並び替えと絞り込みは表示と
     巡回にだけ効かせ、単元ID・データ・計算・描画・保存済みパラメータには
     影響しない。 */
  var PATHS = [
    { id: "path_num", field: "num", name: "数と式の道", desc: "正負の数・文字式・方程式から、展開・因数分解、平方根、複素数まで" },
    { id: "path_geo", field: "geo", name: "図形の道", desc: "平面・空間図形から、合同・相似・三平方、三角比、ベクトルまで" },
    { id: "path_chg", field: "chg", name: "関数と変化の道", desc: "比例・一次関数から、二次関数、指数・対数、微分・積分まで" },
    { id: "path_dat", field: "dat", name: "データと確からしさの道", desc: "データの整理・箱ひげ図から、確率、統計的な推測まで" },
    { id: "path_log", field: "log", name: "論証とアルゴリズムの道", desc: "証明・集合と命題から、数え上げ、帰納法、アルゴリズムまで" }
  ];
  /* 第6分野「社会を読み解く数学」から各道へ振り分けた場面のバッジ（分類は topics.js の path で決まる） */
  var PATH_TAGS = { soc_matrix: "発展", soc_sir: "発展", soc_opt: "応用" };
  var GRADE_LIMITS = [
    { rank: 1, label: "中1まで" }, { rank: 2, label: "中2まで" }, { rank: 3, label: "中3まで" },
    { rank: 4, label: "高1まで" }, { rank: 5, label: "高2まで" }, { rank: 6, label: "全部（高3まで）" }
  ];
  var GRADE_NAMES = { 1: "中1", 2: "中2", 3: "中3", 4: "高1", 5: "高2", 6: "高3" };

  function pathById(id) {
    for (var i = 0; i < PATHS.length; i++) if (PATHS[i].id === id) return PATHS[i];
    return null;
  }
  function pathOf(topic) { return topic ? pathById(topic.path) : null; }
  function gradeRankOf(topic) { return (topic && Number.isInteger(topic.gradeRank)) ? topic.gradeRank : 6; }
  function pathTopics(pathId) {
    return topics.filter(function(t){ return t.path === pathId; }).sort(function(a, b){
      var ra = (typeof a.pathOrder === "number") ? a.pathOrder : 999;
      var rb = (typeof b.pathOrder === "number") ? b.pathOrder : 999;
      if (ra !== rb) return ra - rb;
      return topics.indexOf(a) - topics.indexOf(b);
    });
  }
  function visibleTopics(pathId) {
    return pathTopics(pathId).filter(function(t){ return gradeRankOf(t) <= state.gradeLimit; });
  }
  function allVisibleTopics() {
    var out = [];
    PATHS.forEach(function(p){ visibleTopics(p.id).forEach(function(t){ out.push(t); }); });
    return out;
  }
  /* タブレットのピルバーで表示中の道（未指定なら開いている単元の道） */
  var browsePathId = null;
  function effectiveBrowsePathId() {
    if (browsePathId && pathById(browsePathId)) return browsePathId;
    var t = activeTopic();
    return (t && t.path) ? t.path : PATHS[0].id;
  }
  function emptyPathMessage(pathId) {
    var all = pathTopics(pathId);
    if (!all.length) return "この道の場面はこれから増えます。";
    var min = Math.min.apply(null, all.map(gradeRankOf));
    return "この道は " + (GRADE_NAMES[min] || "") + " の場面から始まります（学年フィルタで非表示）";
  }
  function crumbText(topic) {
    var p = pathOf(topic);
    if (!p) return "";
    var vis = visibleTopics(p.id);
    for (var i = 0; i < vis.length; i++) {
      if (vis[i].id === topic.id) return p.name + " ・ " + (i + 1) + "番目／" + vis.length + "場面";
    }
    return p.name + " ・ 学年フィルタの範囲外の場面";
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function topicById(id) {
    for (var i = 0; i < topics.length; i++) if (topics[i].id === id) return topics[i];
    return null;
  }
  function fieldById(id) {
    for (var i = 0; i < fields.length; i++) if (fields[i].id === id) return fields[i];
    return null;
  }
  function activeTopic() {
    return topicById(state.activeTopicId) || topics[0] || null;
  }
  function paramValues(topic) {
    var vals = {};
    var savedP = state.params[topic.id] || {};
    (topic.params || []).forEach(function(p){
      var v = (typeof savedP[p.key] === "number") ? savedP[p.key] : p.def;
      if (typeof v !== "number" || isNaN(v)) v = p.def;
      vals[p.key] = Math.min(p.max, Math.max(p.min, v));
    });
    return vals;
  }
  function effectiveMode() {
    if (state.deviceMode === "mobile" || state.deviceMode === "tablet" || state.deviceMode === "pc") return state.deviceMode;
    var w = window.innerWidth || document.documentElement.clientWidth || 1024;
    if (w < 768) return "mobile";
    if (w < 1120) return "tablet";
    return "pc";
  }

  /* ===== 効果音（WebAudio・三角波 1318.5Hz・ゲイン0.5・約0.08秒） =====
     本人のiPhone実機で聞こえることが実証済みの音色・音域・音量に合わせた。
     iPhone Safari では AudioContext はユーザー操作の中で生成／resume しないと
     鳴らないため、タッチ・クリック・入力のたびに ensureAudio() で状態を確認し、
     suspended / interrupted なら resume する。連続発音はスロットルする。 */
  var audioCtx = null;
  var lastBeepAt = 0;
  function ensureAudio() {
    if (state.muted) return null;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
        var p = audioCtx.resume();
        if (p && typeof p.catch === "function") p.catch(function(){});
      }
      return audioCtx;
    } catch (e) { return null; }
  }
  function beep() {
    if (state.muted) return;
    var now = (window.performance && typeof performance.now === "function") ? performance.now() : Date.now();
    if (now - lastBeepAt < 80) return; /* スロットル：連続操作でうるさくしない */
    lastBeepAt = now;
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      var t = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1318.5, t);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.09);
    } catch (e) {}
  }
  /* 最初のタッチ／クリック／入力のたびに AudioContext の状態を確認する */
  ["pointerdown", "touchstart", "click", "input"].forEach(function(type){
    document.addEventListener(type, function(){ ensureAudio(); }, true);
  });

  function computeActive() {
    var topic = activeTopic();

    catch (e) { lastResult = { kpis: [] }; }

  }

    if (simCanvas.width !== Math.round(w * dpr) || simCanvas.height !== Math.round(h * dpr)) {

    }
    var ctx = simCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try { data.topic.draw(ctx, w, h, data.vals, data.res); } catch (e) {}
  }

  function levelString(topic) {
    if (!topic.levels) return "";

      var keys = Object.keys(topic.levels);
      for (var i = 0; i < gradeLevels.length; i++) {

      }

    }
    if (lv == null) return "";
    if (typeof lv === "string") return lv;
    if (typeof lv === "object") return lv.text || lv.body || lv.desc || lv.description || lv.title || "";

  /* ===== 学年フィルタ（v2.0.0・第2期 2A／PHASE2_DESIGN §6） =====
     累積式6段階：その学年までの場面だけを道順に表示する。既定値は全部。

    crumb.textContent = crumbText(topic);
    topicHead.appendChild(crumb);
    if (topic.dailyHook) {
      var hook = document.createElement("p");
      hook.className = "hook"; hook.textContent = topic.dailyHook;
      topicHead.appendChild(hook);
    }
    if (topic.guide) {
      var guide = document.createElement("p");
      guide.className = "guide-line"; guide.id = "guideLine";
      var gl = document.createElement("span");
      gl.className = "gl-label"; gl.textContent = "やること：";
      guide.appendChild(gl);
      guide.appendChild(document.createTextNode(topic.guide));
      topicHead.appendChild(guide);
    }
  }

  function renderAll() {
    var topic = activeTopic();
    if (!topic) {
      topicHead.innerHTML = "";
      var p = document.createElement("p");
      p.textContent = "単元データが読み込めませんでした。";
      topicHead.appendChild(p);
      return;
    }
    state.activeTopicId = topic.id;
    markExplored(topic.id);
    renderNavs();
    renderTopicNav();
    renderTopicHead(topic);
    var vals = paramValues(topic);
    renderSliders(topic, vals);
    var data = computeActive();
    renderKpis(data ? data.res : null);
    renderSide(topic);
    drawSim();
    ensureSketch();
    syncStickyOffsets();
  }

  function selectTopic(id, withSound) {
    var t = topicById(id);
    if (!t) return;
    stopNarration();
    state.activeTopicId = id;
    browsePathId = t.path || null;
    showFilterNotice("");
    save();
    if (withSound) beep();
    if (effectiveMode() === "mobile") setTab("lab", false);
    renderAll();
  }

  /* ===== 前の単元／次の単元ナビ（道の中を、表示範囲内だけで巡回） =====
     道の端では、隣の道の端の場面を「次の道へ／前の道へ」として薄く提示する。
     自動では進まず、ボタンが押されたときだけ道をまたぐ（PHASE2_DESIGN §6.3）。 */
  var navTargetsCache = { prev: null, next: null, prevCross: false, nextCross: false };
  function computeNavTargets() {
    var res = { prev: null, next: null, prevCross: false, nextCross: false };
    var topic = activeTopic();
    if (!topic) return res;
    var p = pathOf(topic);
    if (!p) return res;
    var vis = visibleTopics(p.id);
    var idx = -1;
    for (var i = 0; i < vis.length; i++) if (vis[i].id === topic.id) idx = i;
    if (idx > 0) res.prev = vis[idx - 1];
    if (idx >= 0 && idx < vis.length - 1) res.next = vis[idx + 1];
    if (idx === -1) {
      /* フィルタ範囲外の単元を開いているとき（逆引きジャンプ等）は pathOrder で前後を探す */
      vis.forEach(function(t){
        if (typeof t.pathOrder === "number" && typeof topic.pathOrder === "number") {
          if (t.pathOrder < topic.pathOrder) res.prev = t;
          if (t.pathOrder > topic.pathOrder && !res.next) res.next = t;
        }
      });
    }
    if (!res.prev) {
      for (var j = PATHS.indexOf(p) - 1; j >= 0; j--) {
        var pv = visibleTopics(PATHS[j].id);
        if (pv.length) { res.prev = pv[pv.length - 1]; res.prevCross = true; break; }
      }
    }
    if (!res.next) {
      for (var k = PATHS.indexOf(p) + 1; k < PATHS.length; k++) {
        var nv = visibleTopics(PATHS[k].id);
        if (nv.length) { res.next = nv[0]; res.nextCross = true; break; }
      }
    }
    return res;
  }
  function setNavBtn(btn, target, labelText, fallbackTitle, isCross) {
    if (!btn) return;
    var titleEl = btn.querySelector(".tn-title");
    var labelEl = btn.querySelector(".tn-label");
    btn.classList.toggle("tn-cross", !!isCross);
    if (labelEl && labelText) labelEl.textContent = labelText;
    if (target) {
      btn.disabled = false;
      if (titleEl) titleEl.textContent = target.title || "";
    } else {
      btn.disabled = true;
      if (titleEl) titleEl.textContent = fallbackTitle;
    }
  }
  function renderTopicNav() {
    var t = computeNavTargets();
    navTargetsCache = t;
    var prevLabel = t.prevCross ? "← 前の道へ" : "← 前の単元";
    var nextLabel = t.nextCross ? "次の道へ →" : "次の単元 →";
    setNavBtn($("prevBtnTop"), t.prev, prevLabel, "最初の単元です", t.prevCross);
    setNavBtn($("nextBtnTop"), t.next, nextLabel, "最後の単元です", t.nextCross);
    setNavBtn($("prevBtnBottom"), t.prev, prevLabel, "最初の単元です", t.prevCross);
    setNavBtn($("nextBtnBottom"), t.next, nextLabel, "最後の単元です", t.nextCross);
  }
  function stepTopic(delta) {
    var target = delta < 0 ? navTargetsCache.prev : navTargetsCache.next;
    if (!target) return;
    selectTopic(target.id, true);
    window.scrollTo(0, 0);
  }
  ["prevBtnTop", "prevBtnBottom"].forEach(function(id){
    var b = $(id);
    if (b) b.addEventListener("click", function(){ stepTopic(-1); });
  });
  ["nextBtnTop", "nextBtnBottom"].forEach(function(id){
    var b = $(id);
    if (b) b.addEventListener("click", function(){ stepTopic(1); });
  });

  /* ===== 解説の読み上げ（v1.0.2・speechSynthesis・ja-JP・速度1.0） =====
     読み上げる文章は既存データから組み立てる（単元名→問い→やること→
     現在の学年解像度の文章→数学ガイダンス）。記号は読みやすい形に置換する。
     停止ボタンを必ず付け、単元を切り替えたら読み上げを止める。 */
  var narrating = false;
  var narrateBtn = $("narrateBtn"), narrateStopBtn = $("narrateStopBtn"), narrateStatus = $("narrateStatus");
  function narrationText(topic) {
    var parts = [];
    if (topic.title) parts.push(topic.title + "。");
    if (topic.dailyHook) parts.push(topic.dailyHook);
    if (topic.guide) parts.push("やること。" + topic.guide);
    var lv = levelString(topic);
    if (lv) parts.push(lv);
    if (topic.guidance) parts.push(topic.guidance);
    return parts.join(" ")
      .replace(/√/g, "ルート")
      .replace(/²/g, "2乗")
      .replace(/³/g, "3乗")
      .replace(/\s+/g, " ")
      .trim();
  }
  function updateNarrationUI() {
    if (narrateStopBtn) narrateStopBtn.disabled = !narrating;
    if (narrateStatus) narrateStatus.textContent = narrating ? "読み上げ中…" : "";
  }
  function stopNarration() {
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (narrating) { narrating = false; updateNarrationUI(); }
  }
  function startNarration() {
    var topic = activeTopic();
    if (!topic) return;
    if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
      if (narrateStatus) narrateStatus.textContent = "このブラウザでは読み上げに対応していません。";
      return;
    }
    stopNarration();
    var text = narrationText(topic);
    if (!text) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 1.0;
    u.onend = function(){ narrating = false; updateNarrationUI(); };
    u.onerror = function(){ narrating = false; updateNarrationUI(); };
    narrating = true;
    updateNarrationUI();
    try { window.speechSynthesis.resume(); } catch (e) {}
    window.speechSynthesis.speak(u);
  }
  if (narrateBtn) narrateBtn.addEventListener("click", startNarration);
  if (narrateStopBtn) narrateStopBtn.addEventListener("click", stopNarration);

  function setTab(tab, withSound) {
    document.body.setAttribute("data-tab", tab);
    document.querySelectorAll("[data-tab-btn]").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-tab-btn") === tab ? "true" : "false");
    });
    if (withSound) beep();
    if (tab === "memo") ensureSketch();
    if (tab === "lab") drawSim();
  }

  /* ===== お絵描きメモ ===== */
  var sketchReady = false, sketchDrawing = false, sketchLast = null;
  function sketchCtx() { return sketch.getContext("2d"); }
  function ensureSketch() {
    var rect = sketch.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(rect.width * dpr), h = Math.round(rect.height * dpr);
    if (sketch.width === w && sketch.height === h && sketchReady) return;
    var prev = null;
    if (sketchReady && sketch.width > 0) {
      prev = document.createElement("canvas");
      prev.width = sketch.width; prev.height = sketch.height;
      prev.getContext("2d").drawImage(sketch, 0, 0);
    }
    sketch.width = w; sketch.height = h;
    var ctx = sketchCtx();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#334155";
    if (prev) ctx.drawImage(prev, 0, 0, rect.width, rect.height);
    sketchReady = true;
  }
  function sketchPos(ev) {
    var r = sketch.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  sketch.addEventListener("pointerdown", function(ev){
    ensureSketch();
    sketchDrawing = true;
    sketchLast = sketchPos(ev);
    try { sketch.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  window.addEventListener("pointermove", function(ev){
    if (!sketchDrawing) return;
    var p = sketchPos(ev);
    var ctx = sketchCtx();
    ctx.beginPath();
    ctx.moveTo(sketchLast.x, sketchLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    sketchLast = p;
  });
  window.addEventListener("pointerup", function(){ sketchDrawing = false; });
  window.addEventListener("pointercancel", function(){ sketchDrawing = false; });
  $("clearSketchBtn").addEventListener("click", function(){
    ensureSketch();
    var ctx = sketchCtx();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, sketch.width, sketch.height);
    ctx.restore();
  });

  /* ===== 引き出し（ボトムシート）への出し入れ（v2.0.1） =====
     スマホでは実験画面を「課題の状況だけ」に絞るため、学年フィルタ・
     前へ／次へ（上部ナビ）・表示モード切替・更新ボタンを、引き出し
     （「道と単元」タブで開く #tree そのもの）の中へ移す。移すのは実ノード
     そのもので、状態もイベントも1つの仕組みのまま二重管理にならない。
     タブレット／PC では元の場所（ヘッダー／実験エリア）へ戻す。 */
  var chromeMode = null;
  function syncChrome() {
    var mode = effectiveMode();
    if (chromeMode === mode) return;
    /* 初期DOMはタブレット配置（学年フィルタはヘッダー、他は元の場所） */
    if (chromeMode === null && mode === "tablet") { chromeMode = "tablet"; return; }
    chromeMode = mode;
    var updateBtn = $("updateBtn");
    var header = document.querySelector(".app-header");
    if (mode === "mobile") {
      /* スマホ：引き出し（#tree 内の sheetControls）へ */
      if (gradeFilterEl) sheetControls.appendChild(gradeFilterEl);
      if (navTopEl) sheetControls.appendChild(navTopEl);
      if (deviceSegEl) sheetControls.appendChild(deviceSegEl);
      if (updateBtn) sheetControls.appendChild(updateBtn);
    } else if (mode === "pc") {
      /* PC：学年フィルタは左ナビの上部へ寄せ、ヘッダーを1行にする（縦の占有を減らす） */
      if (gradeFilterEl && tree) tree.insertBefore(gradeFilterEl, treeBody);
      if (navTopEl && labEl) labEl.insertBefore(navTopEl, topicHead);
      if (deviceSegEl && headerControlsEl) headerControlsEl.insertBefore(deviceSegEl, $("chooseBtn"));
      if (updateBtn && headerControlsEl) headerControlsEl.appendChild(updateBtn);
    } else {
      /* タブレット：従来どおりヘッダー内 */
      if (gradeFilterEl && header) header.appendChild(gradeFilterEl);
      if (navTopEl && labEl) labEl.insertBefore(navTopEl, topicHead);
      if (deviceSegEl && headerControlsEl) headerControlsEl.insertBefore(deviceSegEl, $("chooseBtn"));
      if (updateBtn && headerControlsEl) headerControlsEl.appendChild(updateBtn);
    }
    syncHeaderHeight();
    syncStickyOffsets();
  }
  /* KPI を Canvas 直下に固定表示するための位置（ヘッダー＋Canvasカードの高さ）を渡す */
  function syncStickyOffsets() {
    var card = document.querySelector(".canvas-card");
    var header = document.querySelector(".app-header");
    if (card && header && card.offsetHeight > 0) {
      document.documentElement.style.setProperty("--kpi-top", (header.offsetHeight + 6 + card.offsetHeight + 4) + "px");
    }
  }

  /* ===== ヘッダー操作 ===== */
  /* スマホ表示で Canvas を固定する位置（ヘッダーの真下）を CSS 変数で渡す */
  function syncHeaderHeight() {
    var header = document.querySelector(".app-header");
    if (header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  function applyDeviceMode() {
    document.body.setAttribute("data-device", state.deviceMode);
    syncChrome();
    syncHeaderHeight();
    document.querySelectorAll("[data-set-device]").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-set-device") === state.deviceMode ? "true" : "false");
    });
  }
  document.querySelectorAll("[data-set-device]").forEach(function(b){
    b.addEventListener("click", function(){
      state.deviceMode = b.getAttribute("data-set-device");
      save();
      applyDeviceMode();
      drawSim();
      ensureSketch();
    });
  });
  function applySound() {
    soundBtn.textContent = state.muted ? "音：オフ" : "音：オン";
    soundBtn.setAttribute("aria-pressed", state.muted ? "false" : "true");
  }
  soundBtn.addEventListener("click", function(){
    state.muted = !state.muted;
    save();
    applySound();
    if (!state.muted) beep();
  });
  $("updateBtn").addEventListener("click", function(){
    var url = new URL(window.location.href);
    url.searchParams.set("v", "v2.0.2-" + Date.now());
    window.location.replace(url.toString());
  });
  document.querySelectorAll("[data-tab-btn]").forEach(function(b){
    b.addEventListener("click", function(){
      var tab = b.getAttribute("data-tab-btn");
      /* スマホでは「道と単元」タブ＝引き出しの開閉（開いているときに押すと閉じる） */
      if (tab === "catalog" && effectiveMode() === "mobile" && document.body.getAttribute("data-tab") === "catalog") {
        setTab("lab", true);
        return;
      }
      setTab(tab, true);
    });
  });
  /* 引き出しの開閉（v2.0.1）：上部バーの「えらぶ」／シートの「とじる」／背景タップ */
  var chooseBtn = $("chooseBtn");
  if (chooseBtn) chooseBtn.addEventListener("click", function(){
    if (effectiveMode() === "mobile") setTab("catalog", true);
  });
  var sheetCloseBtn = $("sheetCloseBtn");
  if (sheetCloseBtn) sheetCloseBtn.addEventListener("click", function(){ setTab("lab", false); });
  var sheetBackdrop = $("sheetBackdrop");
  if (sheetBackdrop) sheetBackdrop.addEventListener("click", function(){
    if (document.body.getAttribute("data-tab") === "catalog") setTab("lab", false);
  });
  $("resetParamsBtn").addEventListener("click", function(){
    var topic = activeTopic();
    if (!topic) return;
    delete state.params[topic.id];
    save();
    renderAll();
  });
  memoText.value = state.memoText || "";
  memoText.addEventListener("input", function(){
    state.memoText = memoText.value;
    save();
  });

  /* ===== リサイズ対応 ===== */
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function(){ drawSim(); });
    ro.observe(canvasWrap);
    var ro2 = new ResizeObserver(function(){ ensureSketch(); });
    ro2.observe(sketch);
  }
  window.addEventListener("resize", function(){ syncChrome(); syncHeaderHeight(); syncStickyOffsets(); drawSim(); });

  /* ===== 初期化 ===== */
  if (!gradeLevels.some(function(g){ return g.id === state.grade; })) state.grade = gradeLevels[1] ? gradeLevels[1].id : gradeLevels[0].id;
  if (["auto", "mobile", "tablet", "pc"].indexOf(state.deviceMode) === -1) state.deviceMode = "auto";
  if (!(Number.isInteger(state.gradeLimit) && state.gradeLimit >= 1 && state.gradeLimit <= 6)) state.gradeLimit = 6;
  applyDeviceMode();
  applySound();
  renderGradeFilter();
  setTab("lab", false);
  renderAll();
  syncHeaderHeight();
  save();
})();
</script>
</body>
</html>
